name: Build TerraGeo

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/TerraGeo/TerraGeo.csproj

      - name: Publish self-contained .exe
        run: >
          dotnet publish src/TerraGeo/TerraGeo.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Upload .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: TerraGeo-win-x64
          path: publish/TerraGeo.exe
          if-no-files-found: error
